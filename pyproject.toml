[project]
name = "cpumon"
version = "1.0.1"
description = "A terminal CPU live monitor."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Simone Caporale" }]
dependencies = []

[project.scripts]
cpumon = "cpumon.cli.main:main"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "cpumon", from = "src" }]

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = ".ruff_cache"
# Prose, not code: the snippets in the docs are aligned for reading, and the
# formatter would strip that alignment.
extend-exclude = ["*.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
cache_dir = ".mypy_cache"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

# The Linux terminal needs termios/tty, which the stubs expose on Unix only.
# Its ignores are therefore needed on Windows and redundant on Linux; the whole
# point is that the file type-checks on both.
[[tool.mypy.overrides]]
module = ["cpumon.backend.linux"]
warn_unused_ignores = false

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff (>=0.16.3,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
